site_name: 小V博客
site_url: https://kjxv.net/

# 写作时复用的片段不单独生成公开页面
exclude_docs: |
  includes/

theme:
  name: material
  language: zh
  custom_dir: overrides 
  features:
    - navigation.tabs
    - navigation.top
    - navigation.indexes
    - content.tabs.link
    - content.code.copy
    - content.code.annotate
  
  # 1. 主题颜色开关
  palette:
    - scheme: default
      primary: white
      accent: indigo
      toggle:
        icon: material/weather-sunny  # 👈 建议用这个图标，语义更清晰
        name: 切换到深色模式
    - scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night  # 👈 建议用这个图标
        name: 切换到浅色模式

# 额外样式        
extra_css:
  - stylesheets/extra.css


# 社交链接与 Telegram 技术支持
extra:
  social:
    - icon: fontawesome/brands/telegram
      link: https://t.me/kejixiaov
      name: Telegram 远程技术支持

# 2. 插件设置
plugins:
  - search:
      lang: zh
  - tags
  - blog:
      pagination_per_page: 5
  - glightbox

markdown_extensions:
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:      # 👈 注意这里加了冒号
      base_path: docs
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

# 3. 导航栏结构
nav:
  - 首页: index.md

  - 专栏博客: 
      - blog/index.md
  - 推荐资源:
      - 推荐: 
          - recommend/index.md
          - VPS 云服务器: recommend/1-vps/index.md
          - 跨境虚拟卡: recommend/2-card/index.md
          - 静态住宅 IP: recommend/3-isp/index.md
          - 加密货币交易所: recommend/4-jiaoyisuo/index.md
          - 机场推荐: recommend/5-jichang/index.md
          - 海外账号平台: recommend/6-accounts/index.md
      - 其他: 
          - tools/index.md
          - 常用工具: tools/2026-03-26-tools.md
          - OpenClaw 安装、使用文档: tools/2026-03-26-Openclaw-tools.md
          - Banwagong(搬瓦工VPS): tools/2026-04-25-VPS-banwagong.md
  - 关于本站: about.md
  - 隐私政策: privacy.md
  - 免责声明: disclaimer.md
  - 技术支持:
      - 远程协助: services/remote-support.md
          
          
