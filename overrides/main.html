{% block announce %}
  🌞 欢迎来到我的专属博客！🚀
{% endblock %}

{% block extrahead %}
  {{ super() }}
  
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3329871586585255"
     crossorigin="anonymous"></script>
    <meta name="google-site-verification" content="dBT_Fsw_ztEwI4nvv53xoEy1Sj9GchxnOpdOwd3NhME" />

{% block toc %}

      <div style="font-weight: bold; font-size: 0.85rem; margin-bottom: 8px; color: #0f172a;">☕ 赞赏支持 / 远程协助</div>

      <div style="font-size: 0.75rem; color: #64748b; margin-top: 6px;">微信 / 支付宝 扫码</div>
    </div>
  </div>

  {{ super() }}
